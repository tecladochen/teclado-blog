packages:
  - .

# Some build-time dependencies in @swup/astro still pin vulnerable versions.
# Keep the original major versions where required, but force patched releases.
overrides:
  '@babel/core@<=7.29.0': 7.29.7
  '@babel/helpers@<7.26.10': 7.29.7
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': 7.29.8
  '@babel/runtime@<7.26.10': 7.29.7
  brace-expansion@<1.1.18: 1.1.18
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  browserslist@<=4.28.6: 4.29.0
  colord@<2.9.4: 2.10.0
  katex@>=0.12.0 <=0.16.20: 0.16.47
  mdast-util-to-hast@>=13.0.0 <13.2.1: 13.2.1
  minimatch@<3.1.4: 3.1.4
  minimatch@>=5.0.0 <5.1.9: 5.1.9
  nanoid@<3.3.19: 3.3.19
  path-to-regexp@>=4.0.0 <6.3.0: 6.3.0
  picomatch@<2.3.2: 2.3.2
  postcss-selector-parser@>=6.1.0 <6.1.4: 6.1.4
  postcss@<8.5.28: 8.5.28
  rollup@<2.80.0: 2.80.0
  serialize-javascript@<7.0.5: 7.0.5
  svgo@>=2.1.0 <2.8.4: 2.8.4
  yaml@>=1.0.0 <1.10.3: 1.10.3

# These packages use their published install scripts to provide binaries or hooks.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - simple-git-hooks
  - swup
