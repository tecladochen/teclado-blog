&lt;script&gt;

  const ns = &#x27;http://www.w3.org/2000/svg&#x27;;

  const label = (parent,x,y,value,attrs={}) =&gt; { const n=el(&#x27;text&#x27;,{x,y,...attrs},parent); n.textContent=value; return n; };

  const polys = p =&gt; [...(p.shapes||[]).map(([x,y,w,h])=&gt;[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]), ...(p.polygons||[])];
  const bounds = ps =&gt; {const xs=ps.map(p=&gt;p[0]),ys=ps.map(p=&gt;p[1]);return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];};
  const overlaps = (p,x,w) =&gt; polys(p).some(ps=&gt;{const b=bounds(ps);return b[2]&gt;x&amp;&amp;b[0]&lt;x+w;});

  const allEntries = entries();
  [&#x27;场所&#x27;,&#x27;人物&#x27;,&#x27;道路&#x27;,&#x27;水系&#x27;,&#x27;样段接点&#x27;].forEach(group=&gt;{const optgroup=document.createElement(&#x27;optgroup&#x27;);optgroup.label=group;allEntries.filter(e=&gt;e.group===group).forEach(e=&gt;{const option=document.createElement(&#x27;option&#x27;);option.value=e.id;option.textContent=e.name;optgroup.append(option);});detailSelect.append(optgroup);});
  const chosen = () =&gt; allEntries.find(e=&gt;e.id===selected)||allEntries[0];

  function choose(id,move=false) {
    selected=id; const item=chosen();
